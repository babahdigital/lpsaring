[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpsaring-backend"
version = "0.0.0"
requires-python = ">=3.12"

# Ruff (mirror dari ruff.toml + backend/ruff.toml; consolidate nanti di Phase 2)
[tool.ruff]
line-length = 120
src = ["backend"]
extend-exclude = ["backend/migrations/versions", "backend/__pycache__", "frontend/node_modules"]

[tool.ruff.lint]
extend-ignore = ["E701", "E702", "E711", "E712", "E402"]

# Mypy — Phase 1: PERMISSIVE; baseline 0 error setelah `disable_error_code` di bawah
# (legacy codebase 100+ files belum di-typed). Phase 2 secara bertahap re-enable kode-kode
# yang sudah di-fix.
[tool.mypy]
python_version = "3.12"
files = ["backend/app", "backend/scripts", "scripts"]
exclude = [
  "backend/migrations/",
  "backend/tests/",
  "backend/test_mikrotik_connection.py",
  "backend/__pycache__/",
  "backend/app/__pycache__/",
]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_redundant_casts = false
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
strict_equality = false
warn_unreachable = false
pretty = true
plugins = ["pydantic.mypy"]
# Phase 1 baseline → 0 error. Codes ini akan di-re-enable bertahap di Phase 2
# (per-module override) seiring file di-typed bertahap.
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "call-arg",
  "call-overload",
  "import-not-found",
  "import-untyped",
  "index",
  "list-item",
  "misc",
  "name-defined",
  "no-redef",
  "operator",
  "override",
  "return-value",
  "syntax",   # tetap aktif di kompilasi Python; mypy syntax error rare
  "type-arg",
  "type-var",
  "union-attr",
  "var-annotated",
  "valid-type",
  "has-type",
  "truthy-function",
  "dict-item",
]

[[tool.mypy.overrides]]
module = [
  "routeros_api.*",
  "midtransclient.*",
  "weasyprint.*",
  "flask_jwt_extended.*",
  "flask_limiter.*",
  "factory.*",
  "user_agents.*",
  "redis.*",
  "celery.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Bandit - Python SAST
[tool.bandit]
exclude_dirs = ["backend/tests", "backend/migrations", ".venv", "node_modules", "frontend"]
skips = [
  "B101",  # assert_used — pytest pakai assert
  "B404",  # subprocess import — kita kontrol semua call di scripts/
  "B603",  # subprocess_without_shell_equals_true — args sudah divalidasi
]
