name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_build: ${{ steps.filter.outputs.frontend_build }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            frontend_build:
              - 'frontend/app.vue'
              - 'frontend/nuxt.config.ts'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pages/**'
              - 'frontend/components/**'
              - 'frontend/layouts/**'
              - 'frontend/middleware/**'
              - 'frontend/plugins/**'
              - 'frontend/store/**'
              - 'frontend/composables/**'
              - 'frontend/utils/**'
              - 'frontend/types/**'
              - 'frontend/@core/**'
              - 'frontend/@layouts/**'
            docker:
              - 'docker-compose*.yml'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
            ci:
              - '.github/workflows/**'
            contracts:
              - 'contracts/openapi/**'
              - 'frontend/types/api/contracts.ts'
              - 'scripts/contract_gate.py'
              - 'scripts/api_quality_gate.py'
              - 'scripts/access_status_parity_gate.py'
            docs:
              - 'docs/API_DETAIL.md'
              - 'docs/ACCESS_STATUS_MATRIX.md'
              - 'docs/workflows/OPENAPI_CONTRACT.md'
      - name: Show change summary
        run: |
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "frontend=${{ steps.filter.outputs.frontend }}"
          echo "frontend_build=${{ steps.filter.outputs.frontend_build }}"
          echo "docker=${{ steps.filter.outputs.docker }}"
          echo "ci=${{ steps.filter.outputs.ci }}"
          echo "contracts=${{ steps.filter.outputs.contracts }}"
          echo "docs=${{ steps.filter.outputs.docs }}"
          {
            echo "### Path Change Summary"
            echo "- backend: ${{ steps.filter.outputs.backend }}"
            echo "- frontend: ${{ steps.filter.outputs.frontend }}"
            echo "- frontend_build: ${{ steps.filter.outputs.frontend_build }}"
            echo "- docker: ${{ steps.filter.outputs.docker }}"
            echo "- ci: ${{ steps.filter.outputs.ci }}"
            echo "- contracts: ${{ steps.filter.outputs.contracts }}"
            echo "- docs: ${{ steps.filter.outputs.docs }}"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-gate:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install contract gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: API quality gate (OpenAPI integrity + generated sync)
        run: |
          python scripts/api_quality_gate.py
      - name: Access status parity gate (FE/BE/docs)
        run: |
          python scripts/access_status_parity_gate.py
      - name: Contract gate (OpenAPI + typed contract + API detail)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/contract_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SKIP_DOTENV_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt
      - name: Dependency hygiene gate
        run: |
          python backend/scripts/refresh_lock_and_validate.py --skip-tests
      - name: Lint backend (ruff check)
        run: |
          python -m ruff check backend
      - name: Format check backend (ruff format) — HARD GATE
        run: |
          python -m ruff format --check backend
      - name: Run backend tests
        run: |
          python -m pytest backend/tests \
            --ignore=backend/tests/test_whatsapp_send.py

  backend-types:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SKIP_DOTENV_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock.txt
      - name: Install backend deps + type tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt
          # Pin terbaru types-* di PyPI (verifikasi: pip index versions types-requests)
          python -m pip install \
            "mypy==1.18.2" \
            "types-requests" \
            "types-pytz" \
            "celery-types==0.23.0"
      - name: Mypy (Phase 1 permissive baseline) — HARD GATE
        id: mypy
        run: |
          python -m mypy --config-file pyproject.toml 2>&1 | tee mypy-report.txt
          {
            echo '### Mypy result'
            echo '```'
            tail -n 40 mypy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node (for Pyright npm pkg)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Pyright (basic mode, Phase 1) — HARD GATE
        run: |
          npm install -g pyright@1.1.403
          pyright 2>&1 | tee pyright-report.txt
          {
            echo '### Pyright result'
            echo '```'
            tail -n 40 pyright-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: type-reports
          path: |
            mypy-report.txt
            pyright-report.txt
            pyright-report.json
          retention-days: 14

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_APP_BASE_URL: https://lpsaring.babahdigital.net
      NUXT_PUBLIC_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable corepack
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install
      - name: Prod config hygiene (dev bypass must be empty on release build)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "${NUXT_PUBLIC_DEV_BYPASS_TOKEN:-}" ]; then
            echo "ERROR: NUXT_PUBLIC_DEV_BYPASS_TOKEN terisi pada build release."
            exit 1
          fi
      - name: UI standards gate (no runtime import from Vuexy full-version)
        run: python3 scripts/enforce_ui_standards.py
      - name: Lint frontend (ESLint, 0 warning allowed) — HARD GATE
        working-directory: frontend
        run: pnpm exec eslint . --ignore-pattern .output --ignore-pattern .nuxt --ignore-pattern .nitro --max-warnings 0
      - name: Typecheck frontend (vue-tsc / nuxt typecheck) — HARD GATE
        working-directory: frontend
        run: pnpm run typecheck
      - name: Stylelint (soft gate, Phase 1)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        continue-on-error: true
        working-directory: frontend
        run: |
          pnpm dlx stylelint@16 "**/*.{vue,scss,css}" \
            --ignore-pattern "node_modules/**" \
            --ignore-pattern ".nuxt/**" \
            --ignore-pattern ".output/**" \
            2>&1 | tee ../stylelint-report.txt || true
          {
            echo '### Stylelint result'
            echo '```'
            tail -n 80 ../stylelint-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Knip dead-code scan (soft gate, Phase 1)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        continue-on-error: true
        working-directory: frontend
        run: |
          pnpm dlx knip@5 --no-progress --reporter compact \
            2>&1 | tee ../knip-report.txt || true
          {
            echo '### Knip dead-code result'
            echo '```'
            tail -n 80 ../knip-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish focused frontend test manifest
        run: |
          TEST_FILES="tests/auth-access.test.ts tests/auth-guards.test.ts tests/access-status-parity.contract.test.ts tests/payment-composables.test.ts tests/payment-status-polling.test.ts"
          echo "FOCUSED_FRONTEND_TESTS=$TEST_FILES" >> "$GITHUB_ENV"
          {
            echo "### Frontend Focused Tests"
            for t in $TEST_FILES; do
              echo "- $t"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run focused frontend unit tests (auth + payment)
        working-directory: frontend
        run: pnpm run test -- $FOCUSED_FRONTEND_TESTS
      - name: Run all frontend unit tests (soft gate, Phase 1)
        # Full vitest sweep — Phase 2 akan jadi hard gate setelah baseline 0 fail.
        if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
        continue-on-error: true
        working-directory: frontend
        run: pnpm run test 2>&1 | tee ../frontend-test-full-report.txt || true
      - name: Build frontend
        if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend_build == 'true' || needs.changes.outputs.ci == 'true' }}
        working-directory: frontend
        run: pnpm run build
      - name: Skip build (PR non-runtime changes)
        if: ${{ github.event_name != 'push' && needs.changes.outputs.frontend_build != 'true' && needs.changes.outputs.ci != 'true' }}
        run: |
          echo "Frontend build skipped: no runtime-critical frontend changes in this PR."
          echo "Build will still run on push to main." >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------
  # docker-build:
  #   - PR / push non-main : push=false, amd64-only (fast verification)
  #   - push to main + tag : push=true, multi-arch (amd64+arm64), fresh build
  #                          (no-cache + cache prune), Trivy scan post-build
  # ----------------------------------------------------------------
  docker-build:
    needs: [changes, backend, frontend, backend-types, contract-gate]
    if: |
      always()
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true')
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      && (needs.backend-types.result == 'success' || needs.backend-types.result == 'skipped')
      && (needs.contract-gate.result == 'success' || needs.contract-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile-prod
            image: babahdigital/sobigidul_backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile-prod
            image: babahdigital/sobigidul_frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set publish flag
        id: pub
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publish=${{ steps.pub.outputs.publish }}"

      - name: Set up QEMU (multi-arch publish only)
        if: ${{ steps.pub.outputs.publish == 'true' }}
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ steps.pub.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Purge builder + image cache (fresh build)
        if: ${{ steps.pub.outputs.publish == 'true' }}
        run: |
          docker builder prune -af || true
          docker image prune -af || true
          docker system df

      - name: Prod config hygiene (frontend dev bypass token must be empty)
        if: ${{ matrix.service == 'frontend' && steps.pub.outputs.publish == 'true' }}
        run: |
          if [ -n "${NUXT_PUBLIC_DEV_BYPASS_TOKEN:-}" ]; then
            echo "::error::NUXT_PUBLIC_DEV_BYPASS_TOKEN terisi pada build production. Blocked."
            exit 1
          fi

      - name: Docker metadata (publish)
        if: ${{ steps.pub.outputs.publish == 'true' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build & push (fresh, multi-arch)
        if: ${{ steps.pub.outputs.publish == 'true' }}
        id: build_publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=3072
            NUXT_PUBLIC_APP_BASE_URL=https://lpsaring.babahdigital.net
            NUXT_PUBLIC_API_BASE_URL=/api

      - name: Build verify (PR / non-publish — amd64 only, cached)
        if: ${{ steps.pub.outputs.publish == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          tags: local/${{ matrix.service }}:ci-${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_APP_BASE_URL=https://lpsaring.babahdigital.net
            NUXT_PUBLIC_API_BASE_URL=/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan (publish only, soft gate)
        if: ${{ steps.pub.outputs.publish == 'true' && steps.build_publish.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build_publish.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
