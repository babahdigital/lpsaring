# ===============================================================
#  Build & Push multi-arch images (linux/amd64 + linux/arm64)
#
#  Trigger policy:
#    - push tags v*           : release build (full fresh, no cache).
#    - workflow_run "ci" success on main + commit message contains
#                              ``[publish]`` (case-insensitive) :
#                              opt-in publish dari hasil CI hijau.
#                              Commit biasa → CI only, NO publish.
#    - workflow_dispatch      : manual ad-hoc rebuild dengan input
#                              fresh_build (default: true) + skip_ci_gate
#                              (hotfix escape hatch).
#
#  Gate:
#    - ci-gate job verifikasi workflow ``ci`` lulus untuk SHA ini
#      (bisa dibypass via skip_ci_gate=true, akan emit warning).
#
#  Output:
#    - Image babahdigital/sobigidul_backend  :latest, :sha-<sha>
#    - Image babahdigital/sobigidul_frontend :latest, :sha-<sha>
#    - Trivy scan report (HIGH/CRITICAL) di GitHub Step Summary
#
#  Deploy: workflow ``deploy`` ter-trigger otomatis setelah workflow
#          ini selesai (lihat .github/workflows/deploy.yml).
# ===============================================================

name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_build:
        description: "Fresh build tanpa GHA cache (lebih lama, hasil deterministik)"
        type: boolean
        required: false
        default: true
      aggressive_cleanup:
        description: "Cleanup agresif builder + image cache di runner sebelum build"
        type: boolean
        required: false
        default: true
      skip_ci_gate:
        description: "DANGEROUS: bypass cek workflow 'ci' lulus (hotfix only)"
        type: boolean
        required: false
        default: false

env:
  DOCKER_BUILDKIT: "1"
  REGISTRY_NAMESPACE: babahdigital
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # JOB 0 ▸ CI Gate — pastikan workflow 'ci' lulus untuk SHA ini.
  # ----------------------------------------------------------------
  ci-gate:
    runs-on: ubuntu-latest
    # Untuk workflow_run yang ter-trigger dari completion of 'ci',
    # cek conclusion=success + opt-in marker [publish] di commit message.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          contains(github.event.workflow_run.head_commit.message, '[publish]')
        )
      }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve target SHA
        id: resolve
        run: |
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            target="${{ github.event.workflow_run.head_sha }}"
          else
            target="${{ github.sha }}"
          fi
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "Target SHA: $target"
      - name: Verifikasi 'ci' workflow lulus
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci_gate == true) && github.event_name != 'workflow_run' }}
        uses: actions/github-script@v8
        with:
          script: |
            const sha = "${{ steps.resolve.outputs.target_sha }}"
            const { owner, repo } = context.repo
            core.info(`Memeriksa status 'ci' untuk SHA ${sha}`)
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: sha, per_page: 100 }
            )
            const ciRun = runs.find(r => r.name === 'ci' && r.status === 'completed')
            if (!ciRun) {
              core.setFailed(`Tidak ada workflow 'ci' completed untuk SHA ${sha}.`)
              return
            }
            if (ciRun.conclusion !== 'success') {
              core.setFailed(`'ci' SHA ${sha} ended with conclusion=${ciRun.conclusion}. Run: ${ciRun.html_url}`)
              return
            }
            core.notice(`CI workflow OK (run ${ciRun.id})`)
      - name: Hotfix override notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_ci_gate == true }}
        run: |
          echo "::warning::CI gate SKIPPED via skip_ci_gate=true (hotfix mode). Audit run ini."

  # ----------------------------------------------------------------
  # JOB 1 ▸ Build & push multi-arch (amd64 + arm64).
  # Fresh build dengan cache stripping opsional.
  # ----------------------------------------------------------------
  build-and-push:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile-prod
            image: babahdigital/sobigidul_backend
            platforms: linux/amd64,linux/arm64
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile-prod
            image: babahdigital/sobigidul_frontend
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.ci-gate.outputs.target_sha }}

      - name: Validasi secret Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "::error::Secret DOCKER_USERNAME tidak tersedia."; exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::Secret DOCKER_PASSWORD tidak tersedia."; exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # ----- Cache purge (fresh build) -----
      # User policy: setiap publish harus benar-benar fresh agar tidak
      # ada layer stale dari iterasi sebelumnya yang menyembunyikan bug.
      - name: Purge builder + image cache (fresh build)
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && (inputs.fresh_build == true || inputs.aggressive_cleanup == true)) }}
        run: |
          echo "==> Purging builder cache + dangling images for fresh build"
          docker builder prune -af || true
          docker image prune -af || true
          docker container prune -f || true
          docker system df

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Prod config hygiene (frontend dev bypass token)
        if: ${{ matrix.service == 'frontend' }}
        run: |
          if [ -n "${NUXT_PUBLIC_DEV_BYPASS_TOKEN:-}" ]; then
            echo "::error::NUXT_PUBLIC_DEV_BYPASS_TOKEN terisi pada build production. Blocked."
            exit 1
          fi

      - name: Build & push ${{ matrix.service }} (fresh, no-cache)
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.fresh_build == true) }}
        id: build_fresh
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          no-cache: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=3072
            NUXT_PUBLIC_APP_BASE_URL=https://lpsaring.babahdigital.net
            NUXT_PUBLIC_API_BASE_URL=/api

      - name: Build & push ${{ matrix.service }} (cached path)
        if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.fresh_build == true)) }}
        id: build_cached
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=3072
            NUXT_PUBLIC_APP_BASE_URL=https://lpsaring.babahdigital.net
            NUXT_PUBLIC_API_BASE_URL=/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Resolve image digest
        id: digest
        run: |
          dig="${{ steps.build_fresh.outputs.digest || steps.build_cached.outputs.digest }}"
          echo "image_digest=$dig" >> "$GITHUB_OUTPUT"
          echo "Built digest: $dig"

      # ----- Image scan -----
      - name: Trivy image scan (soft gate)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.image }}@${{ steps.digest.outputs.image_digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  # ----------------------------------------------------------------
  # JOB 2 ▸ Trigger deploy workflow setelah build sukses.
  # ----------------------------------------------------------------
  trigger-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Deploy hanya kalau:
    #   * tag push (release), ATAU
    #   * commit message mengandung [deploy] (case-insensitive)
    #   * manual dispatch (default: deploy)
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event_name == 'workflow_run' &&
          contains(github.event.workflow_run.head_commit.message, '[deploy]')
        )
      }}
    steps:
      - name: Trigger deploy workflow
        uses: actions/github-script@v8
        with:
          script: |
            const sha = "${{ needs.ci-gate.outputs.target_sha || github.sha }}"
            const ref = "${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}"
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: ref,
              inputs: {
                target_sha: sha,
                do_backup: 'true',
                fresh_pull: 'true',
              },
            })
            core.notice(`Deploy workflow triggered for SHA ${sha} on ${ref}`)
